services:
  crawlj4ai:
    build: .
    container_name: crawlj4ai-scout
    init: true
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    environment:
      BRAVE_API: ${BRAVE_API:-}
      LLM_PROFILE: ${LLM_PROFILE:-gemma4-local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CRAWLJ4AI_MAX_CONCURRENCY: "3"
    volumes:
      - crawlj4ai_data:/data

  # Optional sidecar: docker compose --profile local-ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: crawlj4ai-ollama
    profiles: ["local-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  crawlj4ai_data:
  ollama_models:
