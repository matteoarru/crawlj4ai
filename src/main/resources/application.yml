server:
  port: 8080

crawlj4ai:
  data-dir: ${CRAWLJ4AI_DATA_DIR:/data/.crawlj4ai}
  max-concurrency: ${CRAWLJ4AI_MAX_CONCURRENCY:3}
  headless: true
  scheduler-tick-seconds: 10
  brave-api-key: ${BRAVE_API:}
  monitoring-focus: >
    Track meaningful factual updates, product releases, pricing changes,
    and breaking API deprecations. Ignore timestamps, ads, and UI chrome.

  llm:
    default-profile: ${LLM_PROFILE:gemma4-local}
    profiles:
      default:
        provider: ${LLM_PROVIDER:OLLAMA}
        base-url: ${LLM_BASE_URL:http://localhost:11434}
        api-key: ${LLM_API_KEY:}
        model-name: ${LLM_MODEL:gemma4:e4b}
        temperature: 0.0
        num-ctx: ${LLM_NUM_CTX:32768}
        timeout-seconds: 120
        strict-json-schema: false
        strip-thinking-blocks: true

      gemma4-local:
        provider: OLLAMA
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model-name: gemma4:e4b
        temperature: 0.0
        num-ctx: 32768
        timeout-seconds: 45
        strip-thinking-blocks: true
        fallback-profiles:
          - openai

      qwen-local:
        provider: OLLAMA
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model-name: qwen3.8:27b
        temperature: 0.0
        num-ctx: 32768
        timeout-seconds: 60
        strip-thinking-blocks: true
        fallback-profiles:
          - qwen-cloud
          - openai

      qwen-cloud:
        provider: OPENAI_COMPATIBLE
        base-url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: qwen-plus
        temperature: 0.0
        strict-json-schema: false
        strip-thinking-blocks: true

      openai:
        provider: OPENAI
        api-key: ${OPENAI_API_KEY:}
        model-name: gpt-4o-mini
        temperature: 0.0
        strict-json-schema: true
        strip-thinking-blocks: false

      none:
        provider: NONE
